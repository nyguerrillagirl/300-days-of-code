<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Centered Form</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f2f2f2;
      margin: 0;
    }

    .form-container {
      background-color: #fff;
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .form-row {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }

    label {
      width: 100px;
      text-align: left;
      margin-right: 10px;
    }

    input {
      flex: 1;
      padding: 8px;
    }

    button {
      margin-top: 10px;
      padding: 8px 16px;
    }
  </style>
</head>
<body>
  <form class="form-container">
    <div class="form-row">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name">
    </div>
    <div class="form-row">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email">
    </div>
    <div class="form-row">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password">
    </div>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
